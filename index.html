<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#D4537E">
  <title>医录 · 看病录音助手</title>
  <link rel="stylesheet" href="css/style.css?v=9">
</head>
<body>
  <div id="app">
    <!-- Status bar spacer -->
    <div class="status-bar-spacer"></div>

    <!-- Global patient switcher (shown when 2+ patients) -->
    <div id="patient-switcher" class="patient-switcher hidden">
      <button class="patient-switcher-btn" onclick="App.togglePatientDropdown()">
        <span id="ps-avatar" class="ps-avatar"></span>
        <span id="ps-name" class="ps-name">全部</span>
        <span class="ps-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </span>
      </button>
      <div class="patient-switcher-hint" id="ps-hint"></div>
      <div id="patient-dropdown" class="patient-dropdown hidden"></div>
    </div>

    <!-- Main content area -->
    <main id="content" class="content"></main>

    <!-- Bottom navigation -->
    <nav id="bottom-nav" class="bottom-nav">
      <button class="nav-item active" data-route="home">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12l9-9 9 9M5 10v10h14V10"/>
        </svg>
        <span>首页</span>
      </button>
      <button class="nav-item" data-route="calendar">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2"/>
          <path d="M16 2v4M8 2v4M3 10h18"/>
        </svg>
        <span>日历</span>
      </button>
      <button class="nav-item nav-record" data-route="record">
        <div class="record-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <circle cx="12" cy="12" r="3" fill="currentColor"/>
            <circle cx="12" cy="12" r="8"/>
          </svg>
        </div>
      </button>
      <button class="nav-item" data-route="reminders">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/>
        </svg>
        <span>提醒</span>
      </button>
      <button class="nav-item" data-route="profile">
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span>我的</span>
      </button>
    </nav>

    <!-- Theme welcome overlay (first launch) -->
    <div id="theme-welcome" class="theme-welcome hidden">
      <div class="theme-welcome-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 21s-7-4.5-7-10a4 4 0 017-2.5A4 4 0 0119 11c0 5.5-7 10-7 10z"/>
        </svg>
      </div>
      <h1>欢迎使用医录</h1>
      <p>选一个喜欢的界面风格，开始记录宝宝的每次健康点滴</p>
      <div class="theme-cards">
        <div class="theme-card" data-theme-value="warm" onclick="App.chooseTheme('warm')">
          <div class="theme-card-preview" style="background:#FFF9F2;">
            <div class="dot" style="background:#D85A30;"></div>
            <div class="bar" style="background:#F5C4B3;"></div>
            <div class="dot" style="background:#EF9F27;"></div>
            <div class="bar" style="background:#FAECE7;"></div>
          </div>
          <div class="theme-card-name">暖阳奶油</div>
          <div class="theme-card-desc">奶油底色 · 蜜橘橙 · 温暖有活力</div>
        </div>
        <div class="theme-card" data-theme-value="pink" onclick="App.chooseTheme('pink')">
          <div class="theme-card-preview" style="background:#FDF6F8;">
            <div class="dot" style="background:#D4537E;"></div>
            <div class="bar" style="background:#F4C0D1;"></div>
            <div class="dot" style="background:#ED93B1;"></div>
            <div class="bar" style="background:#FBEAF0;"></div>
          </div>
          <div class="theme-card-name">樱粉温柔</div>
          <div class="theme-card-desc">淡樱粉底 · 玫瑰粉 · 软糯可爱</div>
        </div>
      </div>

      <div class="welcome-identity">
        <div class="welcome-identity-title">你的身份</div>
        <div class="welcome-identity-desc">选一个称呼，首页问候会用上（可不选）</div>
        <div class="welcome-identity-options">
          <div class="welcome-identity-option" data-identity="dad" onclick="App.selectWelcomeIdentity('dad')">
            <div class="welcome-identity-avatar" style="background:#DBEAFE;color:#185FA5;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <span>宝爸</span>
          </div>
          <div class="welcome-identity-option" data-identity="mom" onclick="App.selectWelcomeIdentity('mom')">
            <div class="welcome-identity-avatar" style="background:#FCE7F3;color:#A32D6A;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <span>宝妈</span>
          </div>
        </div>
      </div>

      <button class="theme-welcome-skip" onclick="App.skipTheme()">跳过，使用默认风格</button>
    </div>
  </div>

  <!-- Modal container -->
  <div id="modal-overlay" class="modal-overlay hidden"></div>

  <!-- Toast container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="js/store.js?v=9"></script>
  <script src="js/recorder.js?v=9"></script>
  <script src="js/ai-processor.js?v=9"></script>
  <script src="js/app.js?v=9"></script>
</body>
</html>
