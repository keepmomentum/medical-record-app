name: Yilu

options:
  bundleIdPrefix: com.yilu
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_BITCODE: NO
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"

packages:
  # sherpa-onnx 官方 SPM 包，内含 iOS 预编译 xcframework，无需本地编译 C++
  sherpa-onnx:
    url: https://github.com/k2-fsa/sherpa-onnx
    minVersion: 1.12.0

targets:
  Yilu:
    type: application
    platform: iOS
    sources:
      - path: Yilu
        excludes:
          - "Info.plist"
          - "Resources/**"
    resources:
      # 现有 Web UI（由 scripts/sync_web.sh 从仓库根目录同步）
      - path: Yilu/Resources/web
        buildPhase: resources
        type: folder
      # 医疗术语词典（与 asr-poc 共用同一份）
      - path: Yilu/Resources/medical_terms.txt
        buildPhase: resources
    dependencies:
      - package: sherpa-onnx
        product: sherpa-onnx
    info:
      path: Yilu/Info.plist
      properties:
        CFBundleDisplayName: 医录
        NSMicrophoneUsageDescription: 医录需要访问麦克风，用于记录医生口述的医嘱并离线转写成文字
        NSPhotoLibraryUsageDescription: 医录需要访问相册，用于上传化验单和处方的照片
        NSCameraUsageDescription: 医录需要使用相机，用于拍摄化验单和处方
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yilu.app
        # 模型较大，允许 HTTP 下载但不滥用；生产环境请全部走 HTTPS
        OTHER_LDFLAGS: -ObjC
