name: Yilu

options:
  bundleIdPrefix: com.yilu
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_BITCODE: NO
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"

packages:
  # sherpa-onnx 官方 SPM 包，内含 iOS 预编译 xcframework，无需本地编译 C++
  sherpa-onnx:
    url: https://github.com/k2-fsa/sherpa-onnx
    from: "1.12.0"

targets:
  Yilu:
    type: application
    platform: iOS
    sources:
      # 显式列出源码目录，避免用 excludes 把 Resources 也一起过滤掉
      - path: Yilu/App
      - path: Yilu/ASR
      - path: Yilu/Bridge
      - path: Yilu/Data
      - path: Yilu/Inference
      # 整目录作为「文件夹引用」加入资源，保留 web/css、web/js 的相对目录结构，
      # WKWebView 才能按相对路径加载 index.html；medical_terms.txt 也在其中
      # 资源不能放在名为 Resources 的目录里（iOS codesign 保留名，会报
      # "code object is not signed at all"）。web/ 用 folder reference 保留目录结构，
      # medical_terms.txt 平铺到 bundle 根目录，代码加载路径均无需改动。
      - path: Yilu/Resources/web
        type: folder
        buildPhase: resources
      - path: Yilu/Resources/medical_terms.txt
        buildPhase: resources
      - path: Yilu/Resources/selftest.wav
        buildPhase: resources
        type: folder
        buildPhase: resources
    dependencies:
      - package: sherpa-onnx
        product: sherpa-onnx
    info:
      path: Yilu/Info.plist
      properties:
        CFBundleDisplayName: 医录
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: 医录需要访问麦克风，用于记录医生口述的医嘱并离线转写成文字
        NSPhotoLibraryUsageDescription: 医录需要访问相册，用于上传化验单和处方的照片
        NSCameraUsageDescription: 医录需要使用相机，用于拍摄化验单和处方
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # 显式指定，某些 Xcode 版本下不指定会导致产物名为空（FULL_PRODUCT_NAME = .app）
        PRODUCT_NAME: Yilu
        PRODUCT_BUNDLE_IDENTIFIER: com.yilu.app
        # 真机运行：自动管理签名（需在 Xcode → Settings → Accounts 登录 Apple ID）
        CODE_SIGN_STYLE: Automatic
        # Andreson Gao 的免费 Personal Team（Xcode 26 从 IDEProvisioningTeamByIdentifier 读取）
        DEVELOPMENT_TEAM: 9YM4V56MUG
        # 模型较大，允许 HTTP 下载但不滥用；生产环境请全部走 HTTPS
        OTHER_LDFLAGS: -ObjC
