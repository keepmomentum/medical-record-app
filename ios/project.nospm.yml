# 离线验证工程：不含 sherpa-onnx SPM 依赖
# 用途：在没有网络 / SwiftPM 不可用的环境下，验证 App 主体（WebView 壳 + 桥接 + SQLite）能否编译运行。
# ASR 会因 canImport 失败而走桩实现（录音可用，转写为空）。
# 生成：xcodegen generate --spec project.nospm.yml

name: YiluNoSPM

options:
  bundleIdPrefix: com.yilu
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_BITCODE: NO
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"


targets:
  Yilu:
    type: application
    platform: iOS
    sources:
      # 显式列出源码目录，避免用 excludes 把 Resources 也一起过滤掉
      - path: Yilu/App
      - path: Yilu/ASR
      - path: Yilu/Bridge
      - path: Yilu/Data
      - path: Yilu/Inference
      # 整目录作为「文件夹引用」加入资源，保留 web/css、web/js 的相对目录结构，
      # WKWebView 才能按相对路径加载 index.html；medical_terms.txt 也在其中
      - path: Yilu/Resources
        type: folder
        buildPhase: resources
    info:
      path: Yilu/Info.plist
      properties:
        CFBundleDisplayName: 医录
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: 医录需要访问麦克风，用于记录医生口述的医嘱并离线转写成文字
        NSPhotoLibraryUsageDescription: 医录需要访问相册，用于上传化验单和处方的照片
        NSCameraUsageDescription: 医录需要使用相机，用于拍摄化验单和处方
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # 显式指定，某些 Xcode 版本下不指定会导致产物名为空（FULL_PRODUCT_NAME = .app）
        PRODUCT_NAME: Yilu
        PRODUCT_BUNDLE_IDENTIFIER: com.yilu.nospm
        # 真机运行：自动管理签名（需在 Xcode → Settings → Accounts 登录 Apple ID，
        # 登录后在 Signing & Capabilities 里选 Personal Team 即可）
        CODE_SIGN_STYLE: Automatic
        # 模型较大，允许 HTTP 下载但不滥用；生产环境请全部走 HTTPS
        OTHER_LDFLAGS: -ObjC
