# 本地 xcframework 工程：绕过 SwiftPM，直接链接 sherpa-onnx + onnxruntime 预编译静态库
#
# 适用场景：沙箱环境 / 无网络时，SwiftPM 无法解析远程包（sandbox_apply: Operation not permitted）
# 依赖来源：bash scripts/fetch_vendor.sh（下载到 Vendor/）
# Swift 封装：Yilu/SherpaOnnx/SherpaOnnx.swift（官方 swift-api-examples，随本 target 一起编译，
#             故无需 import SherpaOnnx，改用 HAS_SHERPA 编译标志控制）
#
# 生成：xcodegen generate --spec project.asr.yml
# 编译：xcodebuild -project YiluASR.xcodeproj -scheme Yilu -sdk iphoneos ...

name: YiluASR

options:
  bundleIdPrefix: com.yilu
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    ENABLE_BITCODE: NO
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"

targets:
  Yilu:
    type: application
    platform: iOS
    sources:
      - path: Yilu/App
      - path: Yilu/ASR
      - path: Yilu/Bridge
      - path: Yilu/Data
      - path: Yilu/Inference
      # 官方 Swift 封装（含 SherpaOnnxOfflineRecognizer 等），与 App 同 target 编译
      - path: Yilu/SherpaOnnx
      # 资源不能放在名为 Resources 的目录里（iOS codesign 保留名，会报
      # "code object is not signed at all"）。web/ 用 folder reference 保留目录结构，
      # medical_terms.txt 平铺到 bundle 根目录，代码加载路径均无需改动。
      - path: Yilu/Resources/web
        type: folder
        buildPhase: resources
      - path: Yilu/Resources/medical_terms.txt
        buildPhase: resources
      - path: Yilu/Resources/selftest.wav
        buildPhase: resources
    dependencies:
      - framework: Vendor/sherpa-onnx.xcframework
        embed: false
      - framework: Vendor/onnxruntime.xcframework
        embed: false
    info:
      path: Yilu/Info.plist
      properties:
        CFBundleDisplayName: 医录
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: 医录需要访问麦克风，用于记录医生口述的医嘱并离线转写成文字
        NSPhotoLibraryUsageDescription: 医录需要访问相册，用于上传化验单和处方的照片
        NSCameraUsageDescription: 医录需要使用相机，用于拍摄化验单和处方
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: Yilu
        PRODUCT_BUNDLE_IDENTIFIER: com.yilu.asr
        CODE_SIGN_STYLE: Automatic
        # Andreson Gao 的免费 Personal Team（Xcode 26 从 IDEProvisioningTeamByIdentifier 读取）
        DEVELOPMENT_TEAM: 9YM4V56MUG
        # 开启真实 ASR 实现（ASRService.swift / SherpaOnnx.swift 里的 HAS_SHERPA 分支）
        # 注意：显式设置会覆盖默认的 Debug 标志，必须把 DEBUG 一起加上，否则
        # 所有 #if DEBUG 分支（含 SelfTest 自检）会被编译器裁剪掉
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: HAS_SHERPA DEBUG
        OTHER_LDFLAGS: -ObjC
